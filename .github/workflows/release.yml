name: Publicar versión

# Al subir una etiqueta vX.Y.Z se compila el ejecutable único en los servidores de GitHub
# y se adjunta a una Release. El binario no se genera en el equipo de nadie.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Informativas: dependen del hardware y de la red de la máquina donde corren.
      - name: Pruebas
        continue-on-error: true
        run: dotnet run --project Driverrr.Tests -c Release

      - name: Compilar ejecutable único
        run: >
          dotnet publish Driverrr/Driverrr.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist

      - name: Huella SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Driverrr.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Driverrr.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Crear la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notas = @"
          Descarga **Driverrr.exe** y ábrelo: no necesita instalar nada más.

          - Windows 10 u 11 de 64 bits.
          - El ejecutable no está firmado: Windows puede mostrar un aviso de SmartScreen la primera vez.
          - Comprueba la descarga con la huella de ``SHA256SUMS.txt``.

          Versión temprana, probada en un solo equipo. Lee el README antes de usarla.
          "@
          gh release create "${{ github.ref_name }}" dist/Driverrr.exe dist/SHA256SUMS.txt --title "Driverrr ${{ github.ref_name }}" --notes $notas
